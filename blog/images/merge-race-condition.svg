<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'SF Mono', 'Fira Code', monospace" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#fafaf9" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">PostgreSQL MERGE — concurrent NOT MATCHED race</text>

  <!-- Column headers -->
  <text x="140" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">Thread A</text>
  <text x="360" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Database</text>
  <text x="580" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">Thread B</text>

  <!-- Timeline lines -->
  <line x1="140" y1="75" x2="140" y2="440" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="360" y1="75" x2="360" y2="440" stroke="#475569" stroke-width="2"/>
  <line x1="580" y1="75" x2="580" y2="440" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Step 1: Both threads execute MERGE -->
  <rect x="40" y="90" width="200" height="28" rx="4" fill="#dbeafe"/>
  <text x="140" y="109" text-anchor="middle" fill="#1e40af" font-size="11">MERGE INTO … ON (pk)</text>

  <rect x="480" y="100" width="200" height="28" rx="4" fill="#ede9fe"/>
  <text x="580" y="119" text-anchor="middle" fill="#5b21b6" font-size="11">MERGE INTO … ON (pk)</text>

  <!-- Step 2: Both check — no existing row -->
  <line x1="140" y1="118" x2="360" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="128" text-anchor="middle" fill="#475569" font-size="10">SELECT … ON match?</text>

  <line x1="580" y1="128" x2="360" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="138" text-anchor="middle" fill="#475569" font-size="10">SELECT … ON match?</text>

  <!-- Step 3: DB replies — no row found -->
  <line x1="360" y1="170" x2="140" y2="195" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="178" text-anchor="middle" fill="#475569" font-size="10">NOT MATCHED</text>

  <line x1="360" y1="180" x2="580" y2="205" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="188" text-anchor="middle" fill="#475569" font-size="10">NOT MATCHED</text>

  <!-- Step 4: Both attempt INSERT -->
  <rect x="40" y="210" width="200" height="28" rx="4" fill="#dbeafe"/>
  <text x="140" y="229" text-anchor="middle" fill="#1e40af" font-size="11">INSERT (pk, weight=1)</text>

  <rect x="480" y="220" width="200" height="28" rx="4" fill="#ede9fe"/>
  <text x="580" y="239" text-anchor="middle" fill="#5b21b6" font-size="11">INSERT (pk, weight=1)</text>

  <!-- Step 5: Thread A succeeds -->
  <line x1="140" y1="238" x2="360" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="268" width="140" height="28" rx="4" fill="#dcfce7"/>
  <text x="360" y="287" text-anchor="middle" fill="#166534" font-size="11">✓ row inserted</text>

  <!-- Step 6: Thread B fails -->
  <line x1="580" y1="248" x2="360" y2="310" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="270" y="310" width="180" height="32" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="360" y="325" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">✗ PK violation</text>
  <text x="360" y="338" text-anchor="middle" fill="#dc2626" font-size="10">activation silently lost</text>

  <!-- Annotation box -->
  <rect x="40" y="365" width="640" height="70" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1"/>
  <text x="60" y="385" fill="#92400e" font-size="11" font-weight="bold">Why this doesn't happen on H2:</text>
  <text x="60" y="402" fill="#78350f" font-size="11">H2 executes MERGE atomically — the check-then-insert is a single operation.</text>
  <text x="60" y="419" fill="#78350f" font-size="11">PostgreSQL's MERGE does not use the unique index for NOT MATCHED conflict detection.</text>

  <!-- Fix annotation -->
  <rect x="40" y="440" width="640" height="28" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="60" y="459" fill="#166534" font-size="11" font-weight="bold">Fix:</text>
  <text x="90" y="459" fill="#166534" font-size="11">INSERT … ON CONFLICT (pk) DO UPDATE — PostgreSQL uses the index atomically.</text>
</svg>
