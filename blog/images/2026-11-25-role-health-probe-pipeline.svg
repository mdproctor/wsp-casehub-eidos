<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">RoleHealth Probe Pipeline</text>

  <!-- Data source -->
  <rect x="20" y="52" width="160" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="73" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Knowledge Graph</text>
  <text x="100" y="89" text-anchor="middle" font-size="10" fill="#64748b">AgentTask.role</text>

  <!-- historyByRole arrow -->
  <line x1="180" y1="78" x2="230" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="70" text-anchor="middle" font-size="8" fill="#64748b">historyByRole</text>

  <!-- Wilson box -->
  <rect x="235" y="52" width="140" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="305" y="73" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Wilson LB</text>
  <text x="305" y="89" text-anchor="middle" font-size="10" fill="#3b82f6">z = 1.645</text>

  <!-- Arrow to sufficiency check -->
  <line x1="375" y1="78" x2="420" y2="78" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sufficiency check diamond -->
  <polygon points="490,50 540,78 490,106 440,78" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="490" y="75" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">n &lt; 5?</text>
  <text x="490" y="87" text-anchor="middle" font-size="9" fill="#a16207">sufficiency</text>

  <!-- Yes branch - DeclaredFit -->
  <line x1="540" y1="78" x2="610" y2="78" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="575" y="70" text-anchor="middle" font-size="9" fill="#16a34a">yes</text>
  <rect x="615" y="60" width="90" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="83" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">DeclaredFit</text>

  <!-- No branch down -->
  <line x1="490" y1="106" x2="490" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="128" font-size="9" fill="#64748b">no</text>

  <!-- RoleHealth probe box -->
  <rect x="80" y="150" width="560" height="100" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="360" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">RoleHealth.probe()  — stateless</text>

  <!-- Three status branches -->
  <!-- Fit -->
  <rect x="100" y="185" width="120" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="160" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">Fit</text>
  <text x="160" y="222" text-anchor="middle" font-size="9" fill="#15803d">conf ≥ minConf</text>

  <!-- Marginal -->
  <rect x="260" y="185" width="140" height="50" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="330" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Marginal</text>
  <text x="330" y="222" text-anchor="middle" font-size="9" fill="#a16207">demConf ≤ conf &lt; minConf</text>

  <!-- Unfit -->
  <rect x="440" y="185" width="120" height="50" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="500" y="206" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Unfit</text>
  <text x="500" y="222" text-anchor="middle" font-size="9" fill="#b91c1c">conf &lt; demConf</text>

  <!-- Stateful line -->
  <line x1="40" y1="275" x2="680" y2="275" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="292" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">── the stateful line ──</text>

  <!-- RoleTransitionAdvisor box -->
  <rect x="80" y="305" width="560" height="100" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">RoleTransitionAdvisor.evaluate()  — stateful</text>

  <!-- Hold cycle store -->
  <rect x="100" y="345" width="150" height="45" rx="5" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="175" y="363" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">RoleHoldCycleStore</text>
  <text x="175" y="378" text-anchor="middle" font-size="9" fill="#7e22ce">increment / reset</text>

  <!-- Advice outputs -->
  <rect x="290" y="345" width="100" height="45" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="340" y="363" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Promotion</text>
  <text x="340" y="378" text-anchor="middle" font-size="9" fill="#15803d">Warranted</text>

  <rect x="410" y="345" width="80" height="45" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="450" y="371" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">Hold</text>

  <rect x="510" y="345" width="100" height="45" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="560" y="363" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Demotion</text>
  <text x="560" y="378" text-anchor="middle" font-size="9" fill="#b91c1c">Advised</text>

  <!-- Arrows from probe statuses to advisor -->
  <line x1="160" y1="235" x2="160" y2="303" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="330" y1="235" x2="330" y2="303" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <line x1="500" y1="235" x2="500" y2="303" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>

  <!-- Undeclared side label -->
  <rect x="615" y="155" width="90" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="660" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#64748b">Undeclared</text>

  <!-- PolicyDisabled -->
  <rect x="615" y="345" width="90" height="45" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="660" y="363" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">Policy</text>
  <text x="660" y="378" text-anchor="middle" font-size="10" font-weight="500" fill="#64748b">Disabled</text>

  <!-- Legend -->
  <text x="40" y="445" font-size="9" fill="#64748b">■ Green = healthy path</text>
  <text x="200" y="445" font-size="9" fill="#64748b">■ Amber = watch zone</text>
  <text x="360" y="445" font-size="9" fill="#64748b">■ Red = degraded path</text>
  <text x="520" y="445" font-size="9" fill="#64748b">■ Purple = stateful store</text>
</svg>
