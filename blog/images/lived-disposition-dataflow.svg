<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c44"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="4"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#333">findById() vs findEffective() — data flow</text>

  <!-- Eidos box -->
  <rect x="20" y="50" width="340" height="350" rx="6" fill="none" stroke="#bbb" stroke-dasharray="6,3"/>
  <text x="40" y="72" font-size="11" fill="#888" font-weight="600">EIDOS</text>

  <!-- Neocortex box -->
  <rect x="380" y="50" width="320" height="350" rx="6" fill="none" stroke="#bbb" stroke-dasharray="6,3"/>
  <text x="400" y="72" font-size="11" fill="#888" font-weight="600">NEOCORTEX</text>

  <!-- Registry -->
  <rect x="60" y="100" width="200" height="50" rx="5" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="160" y="122" text-anchor="middle" font-weight="600" fill="#1a56db">AgentRegistry</text>
  <text x="160" y="138" text-anchor="middle" font-size="11" fill="#555">authored descriptors</text>

  <!-- findById path (stays authored) -->
  <rect x="60" y="200" width="200" height="40" rx="5" fill="#fff3e0" stroke="#f59e0b"/>
  <text x="160" y="225" text-anchor="middle" font-weight="600" fill="#b45309">findById()</text>

  <line x1="160" y1="150" x2="160" y2="200" stroke="#555" marker-end="url(#arrow)"/>
  <text x="175" y="180" font-size="10" fill="#888">authored only</text>

  <!-- EidosDescriptorViewSource -->
  <rect x="410" y="200" width="250" height="40" rx="5" fill="#fff3e0" stroke="#f59e0b"/>
  <text x="535" y="225" text-anchor="middle" font-weight="600" fill="#b45309">EidosDescriptorViewSource</text>

  <line x1="260" y1="220" x2="410" y2="220" stroke="#555" marker-end="url(#arrow)"/>

  <!-- PersonalityStateService -->
  <rect x="410" y="100" width="250" height="50" rx="5" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="535" y="122" text-anchor="middle" font-weight="600" fill="#166534">PersonalityStateService</text>
  <text x="535" y="138" text-anchor="middle" font-size="11" fill="#555">3-channel facets, resilience, ledger</text>

  <!-- LivedComposition -->
  <rect x="410" y="280" width="250" height="50" rx="5" fill="#faf5ff" stroke="#a855f7"/>
  <text x="535" y="302" text-anchor="middle" font-weight="600" fill="#6b21a8">LivedComposition.compose()</text>
  <text x="535" y="318" text-anchor="middle" font-size="11" fill="#555">resting + effective profiles</text>

  <line x1="535" y1="150" x2="535" y2="280" stroke="#4a7" marker-end="url(#arrow-green)"/>
  <line x1="535" y1="240" x2="535" y2="280" stroke="#f59e0b" marker-end="url(#arrow)"/>

  <!-- findEffective path -->
  <rect x="60" y="300" width="200" height="40" rx="5" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="160" y="325" text-anchor="middle" font-weight="600" fill="#166534">findEffective()</text>

  <line x1="160" y1="150" x2="160" y2="300" stroke="#4a7" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- LivedDispositionSource -->
  <rect x="60" y="360" width="260" height="30" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-dasharray="4,2"/>
  <text x="190" y="380" text-anchor="middle" font-size="11" fill="#166534">via LivedDispositionSource SPI → neocortex impl</text>

  <line x1="160" y1="340" x2="160" y2="360" stroke="#4a7" stroke-dasharray="3,2" marker-end="url(#arrow-green)"/>

  <!-- Danger zone label -->
  <text x="395" y="265" font-size="10" fill="#c44" font-weight="600">× double-composition</text>
  <text x="395" y="277" font-size="10" fill="#c44">if findById() composed</text>
</svg>
