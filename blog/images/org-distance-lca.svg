<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="520" height="320" rx="8" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Org Distance via LCA Hops</text>

  <!-- Root unit -->
  <rect x="200" y="45" width="120" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#1976d2" font-weight="500">Engineering</text>

  <!-- Lines to children -->
  <line x1="230" y1="80" x2="120" y2="120" stroke="#999" stroke-width="1.5"/>
  <line x1="290" y1="80" x2="400" y2="120" stroke="#999" stroke-width="1.5"/>

  <!-- Left child -->
  <rect x="55" y="120" width="130" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="120" y="142" text-anchor="middle" font-size="12" fill="#1976d2" font-weight="500">Backend Team</text>

  <!-- Right child -->
  <rect x="335" y="120" width="130" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="400" y="142" text-anchor="middle" font-size="12" fill="#1976d2" font-weight="500">Frontend Team</text>

  <!-- Lines to agents -->
  <line x1="90" y1="155" x2="60" y2="195" stroke="#999" stroke-width="1.5"/>
  <line x1="150" y1="155" x2="180" y2="195" stroke="#999" stroke-width="1.5"/>
  <line x1="370" y1="155" x2="400" y2="195" stroke="#999" stroke-width="1.5"/>

  <!-- Agent A -->
  <circle cx="60" cy="210" r="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="60" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">A</text>

  <!-- Agent B -->
  <circle cx="180" cy="210" r="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="180" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#2e7d32">B</text>

  <!-- Agent C -->
  <circle cx="400" cy="210" r="18" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="400" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#e65100">C</text>

  <!-- Distance labels -->
  <!-- A to B: same unit, distance 1 -->
  <path d="M 78 210 Q 120 250 162 210" fill="none" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="120" y="262" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="600">distance = 1</text>
  <text x="120" y="276" text-anchor="middle" font-size="10" fill="#888">same unit → weight 1.0</text>

  <!-- A to C: sibling units, distance 2 -->
  <path d="M 73 196 Q 230 60 387 196" fill="none" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#e65100" font-weight="600">distance = 2</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#888">sibling units → weight 0.7</text>

  <!-- Formula -->
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#555" font-family="monospace">distance = max(1, hops_A_to_LCA + hops_B_to_LCA)</text>
</svg>
