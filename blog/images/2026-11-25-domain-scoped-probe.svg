<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Domain-Scoped Role Fitness Probe</text>

  <!-- ProbeContext box -->
  <rect x="20" y="55" width="160" height="70" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="100" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">ProbeContext</text>
  <text x="100" y="95" text-anchor="middle" font-size="11" fill="#334155">taskDomain: "java"</text>
  <text x="100" y="112" text-anchor="middle" font-size="11" fill="#334155">roleName: "coordinator"</text>

  <!-- Arrow to DefaultRoleHealth -->
  <line x1="180" y1="90" x2="225" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- DefaultRoleHealth box -->
  <rect x="230" y="55" width="180" height="70" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#ca8a04">DefaultRoleHealth</text>
  <text x="320" y="95" text-anchor="middle" font-size="11" fill="#334155">probe(descriptor,</text>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#334155">role, context)</text>

  <!-- Arrow to GraphQuery -->
  <line x1="410" y1="90" x2="455" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AgentGraphQuery box -->
  <rect x="460" y="55" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">AgentGraphQuery</text>
  <text x="580" y="95" text-anchor="middle" font-size="11" fill="#334155">historyByRole(agent, role,</text>
  <text x="580" y="112" text-anchor="middle" font-size="11" fill="#334155">tenancy, since, taskDomain)</text>

  <!-- Divider -->
  <line x1="40" y1="155" x2="680" y2="155" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">taskDomain = null → aggregate all domains (existing behaviour)</text>

  <!-- Domain filter flow -->
  <text x="360" y="210" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">taskDomain = "java" → semantic domain expansion + filter</text>

  <!-- Semantic enricher -->
  <rect x="80" y="235" width="200" height="55" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="180" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#db2777">TaskSemanticEnricher</text>
  <text x="180" y="278" text-anchor="middle" font-size="11" fill="#334155">semanticallyEquivalent()</text>

  <!-- Arrow from enricher -->
  <line x1="280" y1="262" x2="335" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Domain set -->
  <rect x="340" y="235" width="150" height="55" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="415" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">Domain Set</text>
  <text x="415" y="275" text-anchor="middle" font-size="11" fill="#334155">{"java", "jdk", ...}</text>

  <!-- Arrow to filtered query -->
  <line x1="490" y1="262" x2="535" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Filtered query -->
  <rect x="540" y="235" width="150" height="55" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="615" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Filtered History</text>
  <text x="615" y="275" text-anchor="middle" font-size="11" fill="#334155">outcomes ∈ domains</text>

  <!-- Result boxes -->
  <rect x="80" y="325" width="130" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Fit</text>
  <text x="145" y="365" text-anchor="middle" font-size="10" fill="#334155">confidence ≥ min</text>

  <rect x="240" y="325" width="130" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="305" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#ca8a04">Marginal</text>
  <text x="305" y="365" text-anchor="middle" font-size="10" fill="#334155">between thresholds</text>

  <rect x="400" y="325" width="130" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="465" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Unfit</text>
  <text x="465" y="365" text-anchor="middle" font-size="10" fill="#334155">confidence &lt; demotion</text>

  <rect x="560" y="325" width="130" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="625" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0284c7">DeclaredFit</text>
  <text x="625" y="365" text-anchor="middle" font-size="10" fill="#334155">insufficient data</text>

  <!-- Arrow from filtered to results -->
  <line x1="615" y1="290" x2="615" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="305" x2="145" y2="305" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="145" y1="305" x2="145" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="305" x2="305" y2="305" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="305" y1="305" x2="305" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="615" y1="305" x2="465" y2="305" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="465" y1="305" x2="465" y2="320" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>